<!DOCTYPE html>
<html>
<head>
<title>Semantic Elements Example</title>

<style>
body{
    font-family: Arial;
    margin:0;
}

header{
    background-color:#4CAF50;
    color:white;
    padding:15px;
    text-align:center;
}

nav{
    background-color:#333;
    padding:10px;
}

nav a{
    color:white;
    margin:10px;
    text-decoration:none;
}

section{
    padding:20px;
    background:#f4f4f4;
}

article{
    background:white;
    padding:15px;
    margin-top:10px;
    border:1px solid #ddd;
}

aside{
    background:#e7e7e7;
    padding:10px;
    margin:20px;
}

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:10px;
}
</style>

</head>

<body>

<header>
<h1>My Website</h1>
<p>Welcome to Semantic HTML Example</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>

<section>
<h2>Main Section</h2>

<article>
<h3>Article 1</h3>
<p>This is the first article content.</p>
</article>

<article>
<h3>Article 2</h3>
<p>This is the second article content.</p>
</article>

</section>

<aside>
<h3>Side Information</h3>
<p>This is additional information related to the page.</p>
</aside>

<footer>
<p>© 2026 My Website</p>
</footer>

</body>
</html>
